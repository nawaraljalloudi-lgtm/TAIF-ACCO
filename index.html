<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3EFE5">
<title>TAIF ACCOUNTING</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--iv:#F3EFE5;--sf:#FBF9F4;--gd:#C5A46D;--ch:#292929;--mu:#6B665C;--ln:#E2DBC9;--pos:#1E6B3F;--neg:#A3321F}
*{box-sizing:border-box}
body{margin:0;background:var(--iv);color:var(--ch);font-family:'IBM Plex Sans Arabic',Tahoma,sans-serif;font-size:15px}
#sb{position:fixed;top:0;bottom:0;right:0;width:236px;background:var(--sf);border-left:1px solid var(--ln);padding:calc(22px + env(safe-area-inset-top,0)) 0 22px;overflow:auto;z-index:20;transform:translateX(100%);transition:.2s}
#sb.open{transform:none}
.lg{padding:0 22px 20px;font-size:19px;letter-spacing:1px;font-weight:700}.lg small{display:block;font-size:12px;color:var(--mu);letter-spacing:0;font-weight:400}
.ni{display:block;width:100%;text-align:right;background:none;border:0;border-right:3px solid transparent;padding:11px 22px;font:inherit;color:var(--ch);cursor:pointer}
.ni.on{background:var(--iv);border-right-color:var(--gd);font-weight:700}
#bk{position:fixed;inset:0;background:rgba(41,41,41,.4);z-index:15;display:none}#bk.open{display:block}
#top{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0)) 16px 10px;background:var(--sf);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:10}
#top b{flex:1;letter-spacing:1px}
main{padding:22px 16px 60px;max-width:1180px;margin:0 auto}
@media(min-width:900px){#sb{transform:none}#top,main{margin-right:236px}#top{margin-right:236px}main{max-width:none;padding:28px 36px 60px}#mb,#bk{display:none!important}}
h1{margin:0 0 4px;font-size:25px}h2{margin:0 0 12px;font-size:17px}.sub{color:var(--mu);margin:0}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.g{display:grid;gap:14px;margin-bottom:14px}
.c{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:16px;overflow-x:auto}
.k{color:var(--mu);font-size:13px}.v{font-size:23px;font-weight:700;margin-top:6px}.v i{font-style:normal;font-size:13px;color:var(--mu);font-weight:500}
.bt{background:var(--gd);color:var(--ch);border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}
.bo{background:transparent;border:1px solid var(--ch);color:var(--ch);border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer}
.bo.sm,.bt.sm{padding:4px 10px;font-size:13px}.bo.dg{border-color:var(--neg);color:var(--neg)}
button:disabled{opacity:.5;cursor:wait}
table{width:100%;border-collapse:collapse}th{text-align:right;color:var(--mu);font-weight:500;font-size:13px;padding:8px 6px;border-bottom:1px solid var(--ln);white-space:nowrap}td{padding:10px 6px;border-bottom:1px solid #EFE9DA;vertical-align:top}
.n{font-variant-numeric:tabular-nums;text-align:left;white-space:nowrap}.pos{color:var(--pos)}.neg{color:var(--neg)}.mu{color:var(--mu)}
.l{font-size:13px;color:var(--mu);display:block;margin:10px 0 4px}
input,select,textarea{width:100%;border:1px solid #D9D0BA;background:#fff;border-radius:8px;padding:10px 12px;font:inherit;color:var(--ch);min-width:0}
.ch{display:inline-block;padding:6px 14px;border:1px solid #D9D0BA;border-radius:20px;font-size:14px;background:var(--sf);cursor:pointer;margin:0 0 6px 4px}.ch.on{background:var(--ch);color:var(--iv);border-color:var(--ch)}
.bd{display:inline-block;font-size:12px;padding:1px 9px;border-radius:10px;background:#EFE9DA;color:var(--mu)}.bd.ok{color:var(--pos)}.bd.no{color:var(--neg)}
.tot td{font-weight:700;border-top:2px solid var(--gd)}
#modal{position:fixed;inset:0;background:rgba(41,41,41,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:20px 10px;overflow:auto}
#modal.open{display:flex}.mb{background:var(--sf);border-radius:14px;width:100%;max-width:640px;padding:20px;margin:auto 0}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ch);color:var(--iv);padding:12px 20px;border-radius:10px;z-index:99;display:none;max-width:90%}
.err{color:var(--neg);margin-top:10px;white-space:pre-wrap}
.lgn{max-width:400px;margin:70px auto}
.pr{background:#fff;padding:24px;border:1px solid var(--ln)}
@media print{#sb,#top,.hd button,#toast,.noprint{display:none!important}body{background:#fff}#modal{position:static;background:none;display:block;padding:0}.mb{box-shadow:none;max-width:none}main{display:none}}
</style>
</head>
<body>
<aside id="sb"></aside><div id="bk"></div>
<div id="top"><button class="bo sm" id="mb" aria-label="القائمة">☰</button><b id="ttl">TAIF ACCOUNTING</b><button class="bo sm" id="out" hidden>خروج</button></div>
<main id="app"></main><div id="modal"></div><div id="toast"></div>
<script>
const SB_URL='https://dxjcjootfymrgxscofjt.supabase.co',SB_KEY='sb_publishable_T1WkBh5nnRs6HBmsPOgM3w_m-FD4JCC';
const sb=supabase.createClient(SB_URL,SB_KEY);
const CUR=['SYP','USD'],MENU=[['dash','لوحة التحكم'],['cash','الصندوق'],['partners','الشركاء ورأس المال'],['items','المواد والمخزون'],['assets','الأصول الثابتة'],['sales','المبيعات'],['purch','المشتريات'],['cust','العملاء'],['supp','الموردون'],['exp','المصاريف والإيرادات'],['rep','التقارير'],['set','الإعدادات']];
let U=null,D=null,view='dash',sel=null,rtab='pnl',per={k:'year'},cc='SYP',armed=null,modal=null,loading=false,loginErr='';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=n=>(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const sg=n=>n>0.004?'pos':n<-0.004?'neg':'';
const fd=d=>d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):'';
const today=()=>new Date().toISOString().slice(0,10);
const M=(n,c)=>`<span class="n ${sg(n)}">${num(n)} <small>${c}</small></span>`;
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',4500)};
const z=()=>({SYP:0,USD:0});
async function pg(t,s,o,asc){let a=[],f=0;for(;;){let q=sb.from(t).select(s);if(o)q=q.order(o,{ascending:!!asc});const{data,error}=await q.range(f,f+999);if(error)throw error;a=a.concat(data);if(data.length<1000)break;f+=1000}return a}
async function load(){
  loading=true;render();
  try{
    await sb.rpc('ta_init');
    const[set,acc,par,items,pts,inv,pay,ast,dep,lay,mov,aud,LN,stock]=await Promise.all([
      pg('ta_settings','*'),pg('ta_accounts','*','code',1),pg('ta_parties','*','name',1),pg('ta_items','*','name',1),pg('ta_partners','*','name',1),
      pg('ta_invoices','*,party:ta_parties(name),lines:ta_invoice_lines(qty,price,item:ta_items(name))','created_at'),
      pg('ta_payments','*,party:ta_parties(name),invoice:ta_invoices(no)','created_at'),pg('ta_assets','*','d'),pg('ta_dep','*'),
      pg('ta_layers','*,item:ta_items(name)','d',1),pg('ta_moves','*,item:ta_items(name)','created_at'),
      pg('ta_audit','*','id'),pg('ta_lines','*,account:ta_accounts(code,name,type,sys),journal:ta_journals(no,d,kind,memo,rate,ref_type,ref_id,voided_by,reversed_of)','created_at'),
      sb.rpc('ta_stock').then(r=>{if(r.error)throw r.error;return r.data})]);
    D={set:set[0],acc,par,items,pts,inv,pay,ast,dep,lay,mov,aud,LN,stock};
  }catch(e){toast('تعذّر التحميل: '+(e.message||e));D=null}
  loading=false;render();
}
/* ===== حسابات ===== */
function range(){const t=today(),d=new Date();let f,to=t;
  if(per.k==='day')f=t;else if(per.k==='week'){d.setDate(d.getDate()-6);f=d.toISOString().slice(0,10)}else if(per.k==='month')f=t.slice(0,8)+'01';else if(per.k==='year')f=t.slice(0,4)+'-01-01';else{f=per.f||'';to=per.t||''}
  return[f,to]}
const inR=(d,f,t)=>(!f||d>=f)&&(!t||d<=t);
function pnl(f,t){const o={SYP:{rev:0,cogs:0,exp:0},USD:{rev:0,cogs:0,exp:0}};
  for(const l of D.LN){if(!inR(l.journal.d,f,t))continue;const a=l.account,c=l.currency,v=+l.debit-+l.credit;
    if(a.type==='revenue')o[c].rev-=v;else if(a.sys==='cogs')o[c].cogs+=v;else if(a.type==='expense')o[c].exp+=v}
  return o}
const cashBal=()=>{const o=z();D.LN.forEach(l=>{if(l.account.sys==='cash')o[l.currency]+=+l.debit-+l.credit});return o};
const accBal=id=>{const o=z();D.LN.forEach(l=>{if(l.account_id===id)o[l.currency]+=+l.credit-+l.debit});return o};
function partyBal(p){const o=z();D.LN.forEach(l=>{if(l.party_id===p.id)o[l.currency]+=p.kind==='c'?+l.debit-+l.credit:+l.credit-+l.debit});return o}
const stockVal=()=>({SYP:D.stock.reduce((s,x)=>s+ +x.value_syp,0),USD:D.stock.reduce((s,x)=>s+ +x.value_usd,0)});
const invSum=(k,f,t)=>{const o=z();D.inv.forEach(i=>{if(i.kind===k&&i.status==='posted'&&inR(i.d,f,t))o[i.currency]+=+i.total});return o};
/* ===== مكونات ===== */
const hd=(t,s,b)=>`<div class="hd"><div><h1>${t}</h1><p class="sub">${s||''}</p></div><div>${b||''}</div></div>`;
const card=(k,v)=>`<div class="c"><div class="k">${k}</div><div class="v">${v}</div></div>`;
const pair=(k,o)=>card(k,`${M(o.USD,'USD')}<br>${M(o.SYP,'SYP')}`);
function tbl(h,r,nc=[]){return`<table><thead><tr>${h.map((x,i)=>`<th${nc.includes(i)?' class="n"':''}>${x}</th>`).join('')}</tr></thead><tbody>${r.length?r.map(x=>`<tr>${x.map((c,i)=>`<td${nc.includes(i)?' class="n"':''}>${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${h.length}" class="mu">لا يوجد بيانات</td></tr>`}</tbody></table>`}
const chips=(a,cur,act)=>a.map(([v,l])=>`<span class="ch ${cur===v?'on':''}" data-a="${act}" data-v="${v}">${l}</span>`).join('');
const perChips=()=>chips([['day','يومي'],['week','أسبوعي'],['month','شهري'],['year','سنوي'],['custom','فترة مخصصة']],per.k,'per')+(per.k==='custom'?`<div class="row" style="max-width:420px;margin:8px 0"><input type="date" id="pf" value="${per.f||''}"><input type="date" id="pt" value="${per.t||''}"></div>`:'');
const vbtn=(t,id,kind)=>`<button class="bo sm dg" data-a="void" data-t="${t}" data-id="${id}" ${kind?`data-k="${kind}"`:''}>${armed===id?'تأكيد الإلغاء':'إلغاء'}</button>`;
/* ===== الشاشات ===== */
function vDash(){const[f,t]=range(),P=pnl(f,t),cash=cashBal(),sv=stockVal(),S=invSum('s',f,t),Pu=invSum('p',f,t);
  const cap=z();D.pts.forEach(p=>{const b=accBal(p.account_id);CUR.forEach(c=>cap[c]+=b[c])});
  const net=z(),ex=z();CUR.forEach(c=>{net[c]=P[c].rev-P[c].cogs-P[c].exp;ex[c]=P[c].cogs+P[c].exp});
  const mo={};D.LN.forEach(l=>{if(l.currency!==cc)return;const m=l.journal.d.slice(0,7),a=l.account;mo[m]=mo[m]||{r:0,e:0};const v=+l.debit-+l.credit;if(a.type==='revenue')mo[m].r-=v;else if(a.type==='expense')mo[m].e+=v});
  const ms=Object.keys(mo).sort().slice(-6),mx=Math.max(1,...ms.map(m=>Math.max(mo[m].r,mo[m].e)));
  const bars=ms.map((m,i)=>{const x=40+i*64,r=mo[m].r/mx*110,e=mo[m].e/mx*110;return`<rect x="${x}" y="${130-r}" width="24" height="${r}" fill="#C5A46D"/><rect x="${x+27}" y="${130-e}" width="24" height="${e}" fill="#292929"/><text x="${x+26}" y="150" font-size="11" fill="#6B665C" text-anchor="middle">${m.slice(5)}/${m.slice(2,4)}</text>`}).join('');
  const rec=D.LN.filter(l=>l.account.sys==='cash').sort((a,b)=>b.journal.no-a.journal.no).slice(0,6);
  const low=D.stock.filter(x=>+x.qty<=2&&D.lay.some(l=>l.item_id===x.item_id));
  return hd('لوحة التحكم','الفترة: '+(f?fd(f):'من البداية')+' — '+fd(t||today()),perChips())
  +`<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(210px,1fr))">${card('صندوق الدولار',M(cash.USD,'USD'))}${card('صندوق الليرة',M(cash.SYP,'SYP'))}${pair('رأس المال',cap)}${pair('صافي الربح',net)}${pair('إجمالي المبيعات',S)}${pair('إجمالي المشتريات',Pu)}${pair('المصاريف (مع التكلفة)',ex)}${pair('قيمة المخزون',{USD:sv.USD,SYP:sv.SYP})}</div>`
  +`<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="c"><h2>الأداء الشهري</h2>${chips([['SYP','ليرة'],['USD','دولار']],cc,'cc')}<svg viewBox="0 0 420 160" width="100%" role="img" aria-label="مبيعات ومصاريف شهرية"><line x1="20" y1="130" x2="410" y2="130" stroke="#E2DBC9"/>${bars||'<text x="210" y="80" text-anchor="middle" fill="#6B665C">لا يوجد بيانات</text>'}</svg><div class="k"><span style="color:#C5A46D">■</span> إيرادات <span>■</span> مصاريف</div></div>`
  +`<div class="c"><h2>آخر الحركات</h2>${tbl(['البيان','المبلغ'],rec.map(l=>[esc(l.journal.memo||l.journal.kind)+`<br><span class="k">${fd(l.journal.d)}</span>`,M(+l.debit-+l.credit,l.currency)]),[1])}</div></div>`
  +(low.length?`<div class="c" style="border-color:var(--gd)"><b>تنبيه مخزون:</b> ${low.map(x=>esc(x.name)+' ('+num(x.qty).replace('.00','')+')').join('، ')}</div>`:'')}
function vCash(){const cash=cashBal(),[f,t]=range();
  const rows=D.LN.filter(l=>l.account.sys==='cash'&&inR(l.journal.d,f,t)).sort((a,b)=>b.journal.no-a.journal.no||0);
  const k=x=>['capital','exchange','expense','income'].includes(x.journal.kind)&&!x.journal.voided_by&&x.journal.kind!=='void';
  return hd('الصندوق الرئيسي','رصيد مستقل لكل عملة',`<button class="bo" data-a="dep">إيداع</button> <button class="bo" data-a="wd">سحب</button> <button class="bt" data-a="fx">تحويل بين العملتين</button>`)
  +`<div class="g" style="grid-template-columns:1fr 1fr">${card('رصيد الدولار',M(cash.USD,'USD'))}${card('رصيد الليرة',M(cash.SYP,'SYP'))}</div>`+perChips()
  +`<div class="c"><h2>سجل الحركات</h2>${tbl(['التاريخ','رقم القيد','البيان','النوع','المبلغ',''],rows.map(l=>[fd(l.journal.d),l.journal.no,esc(l.journal.memo||''),+l.debit>0?'وارد':'صادر',M(+l.debit-+l.credit,l.currency),k(l)?vbtn('journal',l.journal_id):'']),[4])}</div>`}
function vPartners(){const p=sel&&D.pts.find(x=>x.id===sel);
  if(p){const L=D.LN.filter(l=>l.account_id===p.account_id).sort((a,b)=>a.journal.no-b.journal.no),run=z(),b=accBal(p.account_id);
    return hd('كشف حساب: '+esc(p.name),'مساهمات وسحوبات',`<button class="bo" data-a="back">← رجوع</button> <button class="bt" data-a="pc" data-id="${p.id}">+ مساهمة</button> <button class="bo" data-a="pw" data-id="${p.id}">سحب</button>`)
    +`<div class="g" style="grid-template-columns:1fr 1fr">${card('رأس المال بالدولار',M(b.USD,'USD'))}${card('رأس المال بالليرة',M(b.SYP,'SYP'))}</div><div class="c">${tbl(['التاريخ','البيان','العملة','مساهمة','سحب','الرصيد'],L.map(l=>{run[l.currency]+=+l.credit-+l.debit;return[fd(l.journal.d),esc(l.journal.memo||''),l.currency,+l.credit?num(l.credit):'',+l.debit?num(l.debit):'',M(run[l.currency],l.currency)]}),[3,4,5])}</div>`}
  return hd('الشركاء ورأس المال','المساهمات بالعملة الأصلية. توزيع الأرباح خارج النظام',`<button class="bt" data-a="np">+ شريك</button>`)
  +`<div class="g" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">${D.pts.map(x=>{const b=accBal(x.account_id);return`<div class="c" data-a="op" data-id="${x.id}" style="cursor:pointer"><div class="k">${esc(x.name)}</div><div class="v">${M(b.USD,'USD')}<br>${M(b.SYP,'SYP')}</div></div>`}).join('')||'<div class="c mu">أضف أول شريك</div>'}</div>`}
function vItems(){const it=sel&&D.items.find(x=>x.id===sel),sv=stockVal();
  if(it){const st=D.stock.find(x=>x.item_id===it.id)||{qty:0,value_usd:0,value_syp:0};
    return hd(esc(it.name),'أصناف تابعة: '+(it.subs.join('، ')||'—'),`<button class="bo" data-a="back">← رجوع</button> <button class="bo" data-a="ei" data-id="${it.id}">تعديل</button> <button class="bo" data-a="ar" data-id="${it.id}">${it.archived?'إلغاء الأرشفة':'أرشفة'}</button>`)
    +`<div class="g" style="grid-template-columns:repeat(3,1fr)">${card('الكمية',num(st.qty).replace('.00',''))}${card('قيمة (USD)',M(st.value_usd,'USD'))}${card('قيمة (SYP)',M(st.value_syp,'SYP'))}</div>`
    +`<div class="c"><h2>طبقات التكلفة (الأقدم أولاً)</h2>${tbl(['الدفعة','الكمية المتبقية','التكلفة'],D.lay.filter(l=>l.item_id===it.id&&+l.qty_left>0).map(l=>[fd(l.d),num(l.qty_left).replace('.00',''),M(l.unit_cost,l.currency)]),[1,2])}</div>`
    +`<div class="c"><h2>حركة المادة</h2>${tbl(['التاريخ','الحركة','الكمية'],D.mov.filter(m=>m.item_id===it.id).map(m=>[fd(m.d),+m.qty>0?'دخول':'خروج',`<span class="n ${sg(+m.qty)}">${num(m.qty).replace('.00','')}</span>`]),[2])}</div>`}
  return hd('المواد والمخزون','تكلفة المخزون بطريقة FIFO. الأصناف التابعة للتعريف فقط',`<button class="bt" data-a="ni">+ مادة جديدة</button>`)
  +`<div class="c">${tbl(['المادة','الأصناف التابعة','الكمية','قيمة USD','قيمة SYP'],D.items.filter(i=>!i.archived).map(i=>{const s=D.stock.find(x=>x.item_id===i.id)||{};return[`<a href="#" data-a="oi" data-id="${i.id}" style="color:inherit;font-weight:600">${esc(i.name)}</a>`,esc(i.subs.join('، ')),num(s.qty).replace('.00',''),num(s.value_usd),num(s.value_syp)]}),[2,3,4])}</div>`}
function vInv(k){const L=D.inv.filter(i=>i.kind===k).sort((a,b)=>b.d.localeCompare(a.d)||b.no.localeCompare(a.no)),sm=invSum(k);
  return hd(k==='s'?'فواتير المبيعات':'فواتير المشتريات','نقدي أو آجل. الإلغاء بقيد عكسي',`<button class="bt" data-a="ni2" data-k="${k}">+ فاتورة جديدة</button>`)

  pw(d){formM('سحب شريك',[{k:'d',l:'التاريخ',t:'date',v:today()},{k:'c',l:'العملة',t:'select',o:curOpts},{k:'a',l:'المبلغ',t:'number'},{k:'m',l:'البيان'}],v=>run(()=>rp('ta_capital',{p_partner:d.id,p_date:v.d,p_cur:v.c,p_amt:+v.a,p_withdraw:true,p_memo:v.m||null}),'تم السحب'))},
  np(){formM('شريك جديد',[{k:'n',l:'الاسم'}],v=>run(()=>rp('ta_add_partner',{p_name:v.n.trim()}),'تمت الإضافة'))},
  fx(){formM('تحويل بين العملتين',[{k:'d',l:'التاريخ',t:'date',v:today()},{k:'f',l:'من عملة',t:'select',o:[['USD','USD'],['SYP','SYP']]},{k:'fa',l:'المبلغ المدفوع',t:'number'},{k:'t',l:'إلى عملة',t:'select',o:[['SYP','SYP'],['USD','USD']]},{k:'ta',l:'المبلغ المستلم',t:'number'},{k:'m',l:'ملاحظة'}],v=>run(()=>rp('ta_exchange',{p_date:v.d,p_from:v.f,p_from_amt:+v.fa,p_to:v.t,p_to_amt:+v.ta,p_memo:v.m||null}),'تم التحويل'),'تنفيذ')},
  ni(){formM('مادة جديدة',[{k:'n',l:'اسم المادة'},{k:'s',l:'الأصناف التابعة (افصل بفاصلة)'}],v=>run(()=>ins('ta_items',{name:v.n.trim(),subs:v.s.split(',').map(x=>x.trim()).filter(Boolean)}),'تمت الإضافة'))},
  ei(d){const i=D.items.find(x=>x.id===d.id);formM('تعديل المادة',[{k:'n',l:'اسم المادة',v:i.name},{k:'s',l:'الأصناف التابعة (افصل بفاصلة)',v:i.subs.join(', ')}],v=>run(()=>upd('ta_items',{name:v.n.trim(),subs:v.s.split(',').map(x=>x.trim()).filter(Boolean)},i.id),'تم التعديل'))},
  ar(d){const i=D.items.find(x=>x.id===d.id);run(()=>upd('ta_items',{archived:!i.archived},i.id),'تم');sel=null},
  ni2(d){invM(d.k)},
  al(){syncL();INV.lines.push({item:'',qty:'',price:''});drawInv()},
  rl(d){syncL();INV.lines.splice(+d.i,1);if(!INV.lines.length)INV.lines.push({item:'',qty:'',price:''});drawInv()},
  isave(){const v=fv(),ls=INV.lines.filter(l=>l.item&&+l.qty>0&&l.price!=='').map(l=>({item:l.item,qty:+l.qty,price:+l.price}));
    if(!ls.length){$('#merr').textContent='أضف مادة واحدة على الأقل (مادة وكمية وسعر)';return}
    run(()=>rp(INV.k==='s'?'ta_sale':'ta_purchase',{p_date:v.d,p_party:v.p||null,p_cur:v.c,p_cash:v.t==='cash',p_lines:ls,p_memo:v.m||null}),'تم ترحيل الفاتورة')},
  pi(d){printInv(d.id)},
  np2(d){formM(d.k==='c'?'عميل جديد':'مورد جديد',[{k:'n',l:'الاسم'},{k:'p',l:'الهاتف'}],v=>run(()=>ins('ta_parties',{kind:d.k,name:v.n.trim(),phone:v.p.trim()||null}),'تمت الإضافة'))},
  ep(d){const p=D.par.find(x=>x.id===d.id);formM('تعديل البيانات',[{k:'p',l:'الهاتف',v:p.phone||''}],v=>run(()=>upd('ta_parties',{phone:v.p.trim()||null},p.id),'تم'))},
  pay(d){const p=D.par.find(x=>x.id===d.id),r=p.kind==='c',op=D.inv.filter(i=>i.party_id===p.id&&i.status==='posted'&&+i.total-+i.paid>0.000001);
    formM(r?'تسجيل قبض':'تسجيل دفعة',[{k:'d',l:'التاريخ',t:'date',v:today()},{k:'c',l:'العملة',t:'select',o:curOpts},{k:'a',l:'المبلغ',t:'number'},{k:'i',l:'ربط بفاتورة (اختياري)',t:'select',o:[['','حساب '+(r?'العميل':'المورد')+' بدون ربط'],...op.map(i=>[i.id,i.no+' — المتبقي '+num(+i.total-+i.paid)+' '+i.currency])]},{k:'m',l:'ملاحظة'}],v=>run(()=>rp('ta_payment',{p_kind:r?'r':'y',p_date:v.d,p_party:p.id,p_cur:v.c,p_amt:+v.a,p_invoice:v.i||null,p_memo:v.m||null}),'تم التسجيل'))},
  ne(){const ac=D.acc.filter(a=>(a.type==='expense'&&!['cogs','depexp'].includes(a.sys))||(a.type==='revenue'&&a.sys!=='sales'));
    formM('حركة جديدة',[{k:'x',l:'النوع',t:'select',o:[['e','مصروف'],['i','إيراد']]},{k:'a',l:'التصنيف',t:'select',o:ac.map(a=>[a.id,(a.type==='expense'?'مصروف: ':'إيراد: ')+a.name])},{k:'d',l:'التاريخ',t:'date',v:today()},{k:'c',l:'العملة',t:'select',o:curOpts},{k:'n',l:'المبلغ',t:'number'},{k:'m',l:'الوصف'}],v=>{const a=D.acc.find(z=>z.id===v.a);if(!a||(v.x==='i')!==(a.type==='revenue')){$('#merr').textContent='اختر تصنيفاً يناسب النوع';return}return run(()=>rp('ta_expense',{p_date:v.d,p_account:v.a,p_cur:v.c,p_amt:+v.n,p_memo:v.m||null,p_income:v.x==='i'}),'تم التسجيل')})},
  nc(){formM('تصنيف جديد',[{k:'x',l:'النوع',t:'select',o:[['expense','مصروف'],['revenue','إيراد']]},{k:'n',l:'الاسم'}],v=>{const cs=D.acc.filter(a=>a.type===v.x).map(a=>+a.code);return run(()=>ins('ta_accounts',{code:String(Math.max(v.x==='expense'?6000:4000,...cs)+1),name:v.n.trim(),type:v.x}),'تمت الإضافة')})},
  na(){formM('أصل ثابت جديد',[{k:'n',l:'اسم الأصل'},{k:'d',l:'تاريخ الشراء',t:'date',v:today()},{k:'c',l:'العملة',t:'select',o:curOpts},{k:'a',l:'التكلفة',t:'number'},{k:'l',l:'العمر بالأشهر',t:'number',v:36}],v=>run(()=>rp('ta_asset',{p_date:v.d,p_name:v.n.trim(),p_cur:v.c,p_cost:+v.a,p_life:parseInt(v.l)}),'تم تسجيل الأصل'))},
  async rd(){try{const n=await rp('ta_depreciate',{p_upto:today()});toast(n?`تم ترحيل ${n} قيد إهلاك`:'لا يوجد إهلاك مستحق');await load()}catch(e){toast(e.message)}},
  async ss(){try{const{error}=await sb.from('ta_settings').update({project:$('#s_project').value.trim(),rate:+$('#s_rate').value,s_prefix:$('#s_sp').value.trim(),p_prefix:$('#s_pp').value.trim()}).eq('user_id',U.id);if(error)throw error;toast('تم الحفظ');await load()}catch(e){toast(e.message)}},
  bk(){const b=new Blob([JSON.stringify({at:new Date().toISOString(),data:D},null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='taif-backup-'+today()+'.json';a.click()},
  async void(d){if(armed!==d.id){armed=d.id;render();setTimeout(()=>{if(armed===d.id){armed=null;render()}},4000);return}
    const r=prompt('سبب الإلغاء (اختياري)');if(r===null){armed=null;render();return}armed=null;
    try{await rp('ta_void',{p_type:d.t,p_id:d.id,p_reason:r||null});toast('تم الإلغاء بقيد عكسي');await load()}catch(e){toast(e.message);render()}},
  mx(){closeM()},
  msave(){const b=$('#modal [data-a=msave]');b.disabled=true;Promise.resolve(modal.submit(fv())).finally(()=>{b.disabled=false})}
};
function syncL(){document.querySelectorAll('#modal [data-li]').forEach(e=>INV.lines[+e.dataset.li][e.dataset.lf]=e.value)}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(t){e.preventDefault();const f=A[t.dataset.a];if(f)f(t.dataset);return}
  if(e.target.id==='mb'||e.target.id==='bk'){$('#sb').classList.toggle('open');$('#bk').classList.toggle('open')}
  if(e.target.id==='out')sb.auth.signOut();
  if(e.target.id==='modal'&&!INV)closeM();
});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.li!==undefined&&INV){INV.lines[+el.dataset.li][el.dataset.lf]=el.value;const s=$('#tot');if(s)s.textContent=num(INV.lines.reduce((a,l)=>a+(+l.qty||0)*(+l.price||0),0))}});
document.addEventListener('change',e=>{if(e.target.id==='pf'||e.target.id==='pt'){per.f=$('#pf').value;per.t=$('#pt').value;render()}});
const _c=closeM;closeM=function(){INV=null;_c()};
sb.auth.onAuthStateChange((_e,s)=>{U=s?.user||null;if(U)load();else{D=null;render()}});
sb.auth.getSession().then(({data})=>{if(!data.session)render()});
</script>
